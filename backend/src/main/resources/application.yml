spring:
  application:
    name: backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/backend_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing,*:future"

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN:}
    password: ${BREVO_SMTP_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-binding-errors: never

app:
  name: ${APP_NAME:Backend}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  platform:
    # Marketplace commission taken from each completed job, as a percentage.
    fee-percent: ${PLATFORM_FEE_PERCENT:10}
  jwt:
    # Generate a strong secret: openssl rand -base64 64
    secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LW11c3QtY2hhbmdl}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}       # 15 minutes
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    temp-token-expiration-ms: ${JWT_TEMP_EXPIRATION_MS:300000}           # 5 minutes
  token:
    email-confirmation-expiration-hours: ${EMAIL_CONFIRMATION_EXPIRATION_HOURS:24}
    password-reset-expiration-hours: ${PASSWORD_RESET_EXPIRATION_HOURS:2}
  email:
    from-address: ${EMAIL_FROM_ADDRESS:noreply@example.com}
    from-name: ${EMAIL_FROM_NAME:Backend App}

stripe:
  # Secret API key (sk_test_… in test mode). Leave blank to disable payments.
  secret-key: ${STRIPE_SECRET_KEY:}
  # Signing secret for the payment webhook (whsec_…), from the Stripe dashboard
  # or `stripe listen` during local development.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # ISO currency code charged on Stripe Checkout. EUR to match the payment QR.
  currency: ${STRIPE_CURRENCY:eur}
  # Platform commission, as a percentage of each invoice, kept as the Stripe
  # application fee on destination charges. The rest goes to the provider.
  application-fee-percent: ${STRIPE_APPLICATION_FEE_PERCENT:10}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash-lite}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  max-file-size-mb: ${CLOUDINARY_MAX_FILE_SIZE_MB:5}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false

logging:
  level:
    com.example.backend: INFO
    org.springframework.security: WARN
